<!DOCTYPE html>
<html>
<head>
    <title>Hand Therapy Measurement Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            background:#f2f2f2;
            padding:20px;
        }

        .card {
            background:white;
            padding:20px;
            border-radius:15px;
            max-width:1100px;
            margin:auto;
        }

        .form {
            display:grid;
            grid-template-columns: repeat(2,1fr);
            gap:12px;
        }

        input, select, textarea, button {
            padding:8px;
            font-size:14px;
        }

        textarea {
            grid-column: span 2;
        }

        .graphs {
            margin-top:25px;
            display:grid;
            gap:20px;
        }

        .graph-box {
            height:260px;
        }

        canvas {
            width:100% !important;
            height:100% !important;
        }

        .buttons {
            margin-top:20px;
            text-align:right;
        }

        label {
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 4px;
            display: block;
        }

        #countdown {
            margin-top: 10px;
            font-weight: bold;
            color: #cc0000;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Patient Information</h2>

    <div class="form">
        <div>
            <label>Name:</label>
            <input id="name" type="text">
        </div>

        <div>
            <label>Date of Birth:</label>
            <input id="dob" type="date">
        </div>

        <div>
            <label>Age:</label>
            <input id="age" type="number">
        </div>

        <select id="movement">
            <option>Lateral</option>
            <option>Push</option>
            <option>Pull</option>
            <option>Palm</option>
        </select>

        <select id="finger">
            <option>Left Index</option>
            <option>Left Thumb</option>
            <option>Left Pinky</option>
            <option>Left Point</option>
            <option>Left Ring</option>
            <option>Right Index</option>
            <option>Right Thumb</option>
            <option>Right Pinky</option>
            <option>Right Ring</option>
            <option>Right Point</option>
        </select>

        <textarea id="description" placeholder="Patient description / notes"></textarea>
    </div>

    <div class="graphs" id="graphs">
        <div class="graph-box" id="g0"><canvas id="c0"></canvas></div>
        <div class="graph-box" id="g1"><canvas id="c1"></canvas></div>
        <div class="graph-box" id="g2"><canvas id="c2"></canvas></div>
        <div class="graph-box" id="g3"><canvas id="c3"></canvas></div>
    </div>

    <div class="buttons">
        <button onclick="createExcel()">Create Excel</button>
        <button id="captureBtn" onclick="startCountdown()">Capture Measurement</button>
    </div>

    <div id="countdown"></div>
</div>

<script>
/* ================= CHARTS ================= */
const charts = {};
const sensorLabels = {
    c0: "Sensor 0 (Lateral X)",
    c1: "Sensor 1 (Lateral Y)",
    c2: "Sensor 2 (Lateral Z)",
    c3: "Sensor 3 (Force)"
};

function makeChart(id){
    charts[id] = new Chart(document.getElementById(id),{
        type:'line',
        data:{
            labels:Array(50).fill(""),
            datasets:[{
                label:sensorLabels[id],
                data:Array(50).fill(0),
                borderWidth:2
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:false,
            animation:false,
            scales: {
                y: {
                    min: 2000,
                    max: 5000
                }
            }
        }
    });
}

["c0","c1","c2","c3"].forEach(makeChart);

/* ================= LIVE DATA ================= */
const evt = new EventSource("/data");
evt.onmessage = e => {
    const d = JSON.parse(e.data);
    ["C0","C1","C2","C3"].forEach((k,i)=>{
        const chart = charts["c"+i];
        chart.data.datasets[0].data.push(d[k]);
        chart.data.datasets[0].data.shift();
        chart.update();
    });
};

/* ================= LAYOUT ================= */
const movement = document.getElementById("movement");

function updateLayout(){
    const move = movement.value;
    if(move === "Lateral"){
        graphs.style.gridTemplateColumns = "repeat(3, 1fr)";
        g0.style.display = g1.style.display = g2.style.display = "block";
        g3.style.display = "none";
    } else {
        graphs.style.gridTemplateColumns = "1fr";
        g0.style.display = g1.style.display = g2.style.display = "none";
        g3.style.display = "block";
    }
}
movement.addEventListener("change", updateLayout);
updateLayout();

/* ================= EXCEL ================= */
function createExcel(){
    fetch("/create_excel",{method:"POST"})
    .then(r=>r.json())
    .then(d=>alert(d.message));
}

/* ================= COUNTDOWN + CAPTURE ================= */
function startCountdown(){
    let t = 3;
    const cd = document.getElementById("countdown");
    const btn = document.getElementById("captureBtn");

    btn.disabled = true;
    cd.innerText = "Measurement starts in " + t + "...";

    const timer = setInterval(()=>{
        t--;
        if(t > 0){
            cd.innerText = "Measurement starts in " + t + "...";
        } else {
            clearInterval(timer);
            cd.innerText = "Measuring...";
            sendCapture();
        }
    },1000);
}

function sendCapture(){
    fetch("/capture",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            name: name.value,
            age: age.value,
            dob: dob.value,
            description: description.value,
            movement: movement.value,
            finger: finger.value
        })
    })
    .then(r=>r.json())
    .then(d=>{
        document.getElementById("countdown").innerText = "Measurement completed";
        document.getElementById("captureBtn").disabled = false;
    });
}
</script>

</body>
</html>
